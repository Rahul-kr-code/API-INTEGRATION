<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad Joke Generator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        #joke {
            font-size: 18px;
            margin: 20px 0;
            color: #333;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #4facfe;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #007bff;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>😂 Dad Joke</h1>
    <p id="joke">Click the button to get a joke!</p>
    <button onclick="getJoke()">Get Joke</button>
</div>

<script>
async function getJoke() {
    const jokeElement = document.getElementById("joke");

    try {
        jokeElement.innerText = "Loading joke... ⏳";

        const response = await fetch("https://icanhazdadjoke.com/", {
            headers: {
                Accept: "application/json"
            }
        });

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();
        jokeElement.innerText = data.joke;

    } catch (error) {
        jokeElement.innerText = "Failed to load joke 😢";
    }
}
</script>
</body>
</html>
